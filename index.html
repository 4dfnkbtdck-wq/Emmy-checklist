<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Emmy Checklist</title>
  <meta name="description" content="Track Emmy Award winners for Best Drama, Best Comedy, Best Limited Series, and Best TV Movie, and check off the ones you've seen." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b8860b'/%3E%3Cpath d='M32,28 C16,28 16,50 32,50' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M68,28 C84,28 84,50 68,50' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M30,24 L70,24 L61,52 Q50,60 39,52 Z' fill='white'/%3E%3Crect x='45' y='58' width='10' height='14' fill='white'/%3E%3Crect x='36' y='72' width='28' height='7' rx='2' fill='white'/%3E%3Crect x='29' y='80' width='42' height='8' rx='2' fill='white'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="img/icons/icon-180.png?v=2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Emmy" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <span class="navbar-badge"><svg viewBox="0 0 100 100" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32,28 C16,28 16,50 32,50" stroke="white" stroke-width="7" stroke-linecap="round"/><path d="M68,28 C84,28 84,50 68,50" stroke="white" stroke-width="7" stroke-linecap="round"/><path d="M30,24 L70,24 L61,52 Q50,60 39,52 Z" fill="white"/><rect x="45" y="58" width="10" height="14" fill="white"/><rect x="36" y="72" width="28" height="7" rx="2" fill="white"/><rect x="29" y="80" width="42" height="8" rx="2" fill="white"/></svg></span>
      <span class="navbar-title">Emmy Checklist</span>
      <a class="navbar-link" href="unwatched.html">Still To Watch</a>
    </div>
  </div>

  <main class="screen">
    <div class="large-title-block">
      <h1 class="large-title">Emmy<br />Checklist</h1>
      <p class="large-subtitle">Check off the winners you've seen</p>
    </div>

    <div class="segmented" id="category-segmented"></div>

    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 of 0 seen</span>
    </div>

    <div class="search-wrap">
      <input type="search" id="search" class="search-input" placeholder="Search shows or years" autocomplete="off" />
    </div>

    <div class="toolbar-row">
      <button type="button" id="sort-toggle" class="toolbar-btn">Newest First</button>
      <button type="button" id="mark-all-seen" class="toolbar-btn">Mark All Seen</button>
      <button type="button" id="clear-all-seen" class="toolbar-btn">Clear All</button>
    </div>

    <p class="category-note hidden" id="category-note"></p>

    <section class="ios-group">
      <ul class="ios-list" id="winners-list"></ul>
    </section>

    <p class="page-footer">Fan-made tracker. Not affiliated with the Television Academy. Data compiled from public record — see README for confidence notes.</p>
  </main>

  <!-- Bump every ?v= below (including the stylesheet in <head>, and the
       matching tags in unwatched.html) on any deploy that touches
       css/js — GitHub Pages and mobile browsers can otherwise keep
       serving stale cached files after a redeploy. -->
  <script src="js/data.js?v=3"></script>
  <script src="js/shared.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => reg.update());
      });
      // A new service worker (skipWaiting + clients.claim, both already
      // in sw.js) takes over silently — without this, an already-open
      // tab/installed app keeps running the OLD page's JS until the
      // user manually force-quits and relaunches. Reload once instead,
      // so updates actually reach anyone with the app already open.
      let reloadedForNewSw = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForNewSw) return;
        reloadedForNewSw = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
